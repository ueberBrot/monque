name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality & Package Builds
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          task-cache: "true"

      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/scope.sh

      - name: Format
        run: vp fmt --check

      - name: Lint
        run: vp lint --deny-warnings

      - name: Test CI selection and gate
        run: vp test run --project ci

      - name: Build packages
        run: vp run --filter './packages/*' build

      # Workspace type checks consume the packages' generated declarations.
      - name: Type check
        run: |
          vp run --filter @monque/docs --ignore-depends-on generate:api
          vp run --filter './packages/*' --filter './apps/*' --ignore-depends-on type-check
          vp lint --type-aware --type-check -A all

      - name: Upload build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: |
            packages/*/dist
            apps/docs/src/content/docs/api*/**
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  build-apps:
    name: Build Apps
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          task-cache: "true"

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: Build apps
        env:
          RUNTIME_CHECKS: ${{ needs.quality.outputs.runtime }}
        run: |
          if [[ "$RUNTIME_CHECKS" == "true" ]]; then
            vp run --filter './apps/*' --ignore-depends-on build
          else
            vp run --filter @monque/docs --ignore-depends-on build
          fi

  test:
    name: Test (${{ matrix.group }})
    if: needs.quality.outputs.runtime == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        group: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus

      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: .

      - name: Frontend tests
        if: matrix.group == 'frontend'
        run: vp run --filter @monque/dashboard --filter @monque/dashboard-dev --ignore-depends-on --concurrency-limit 1 test

      - name: Backend tests
        if: matrix.group == 'backend'
        run: vp run --filter './packages/*' --filter '!@monque/dashboard' --ignore-depends-on --concurrency-limit 2 test

  dashboard-e2e:
    name: Dashboard MongoDB E2E (${{ matrix.project }})
    if: needs.quality.outputs.runtime == 'true'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        project: [mongo-desktop, mongo-mobile, mongo-desktop-auth, mongo-mobile-auth]
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.2.6-20260529T125201Z
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
      - name: Download build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: .
      - name: Install Chromium
        working-directory: apps/dashboard-dev
        run: vp exec playwright install --with-deps --no-shell chromium
      - name: Test built dashboard with MongoDB and Express
        working-directory: apps/dashboard-dev
        run: vp exec playwright test --project=${{ matrix.project }}
      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-${{ matrix.project }}
          path: |
            apps/dashboard-dev/playwright-report
            apps/dashboard-dev/test-results
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs: [quality, build-apps, test, dashboard-e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci/gate.sh
