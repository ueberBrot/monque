name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env
        with:
          turbo-cache: 'false'

      - name: Lint & Format
        run: bun run lint

  build:
    name: Build Packages & Type Check
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build packages
        run: bun turbo build --filter='./packages/*'

      # Workspace type checks consume the packages' generated declarations.
      - name: Type check
        run: bun turbo type-check --only

      - name: Check exports
        run: bun turbo check:exports --filter='./packages/*' --only

      - name: Upload built packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: packages/*/dist
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  build-apps:
    name: Build Apps
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: packages

      - name: Build apps
        run: bun turbo build --filter='./apps/*' --only

  test:
    name: Test & Coverage (${{ matrix.group }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env
        with:
          turbo-cache-scope: ${{ matrix.group }}

      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: packages

      - name: Frontend tests
        if: matrix.group == 'frontend'
        run: bun turbo test --only --filter=@monque/dashboard --filter=@monque/dashboard-dev --concurrency=1

      - name: Backend tests
        if: matrix.group == 'backend'
        run: bun turbo test --only --filter='!@monque/dashboard' --filter='!@monque/dashboard-dev' --concurrency=2

      - name: Upload coverage reports to Codecov
        if: matrix.group == 'backend'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dashboard-e2e:
    name: Dashboard MongoDB E2E (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [mongo-desktop, mongo-mobile, mongo-desktop-auth, mongo-mobile-auth]
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.2.6-20260529T125201Z
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env
        with:
          turbo-cache: 'false'
      - name: Download built packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-artifacts
          path: packages
      - name: Install Chromium
        working-directory: apps/dashboard-dev
        run: bunx playwright install --with-deps --only-shell chromium
      - name: Test built dashboard with MongoDB and Express
        working-directory: apps/dashboard-dev
        run: bunx playwright test --project=${{ matrix.project }}
      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-${{ matrix.project }}
          path: |
            apps/dashboard-dev/playwright-report
            apps/dashboard-dev/test-results
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs: [lint, build, build-apps, test, dashboard-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [[ "$result" != "success" ]]; then
              echo "Job failed with result: $result"
              exit 1
            fi
          done
