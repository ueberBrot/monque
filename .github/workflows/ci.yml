name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality & Package Builds
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          task-cache: "true"

      - name: Select checks
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/ci/scope.sh

      - name: Format
        run: vp fmt --check

      - name: Fast lint
        run: vp run lint:fast

      - name: Test CI selection and gate
        run: vp test run --project ci

      - name: Build packages
        run: vp run --filter './packages/*' build

      - name: Upload build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: packages/*/dist
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  build-apps:
    name: Type Checks & App Builds
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          task-cache: "true"

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: packages

      # Built declarations are available; check types alongside the runtime suites.
      - name: Type check and typed lint
        run: |
          vp exec effect-tsgo --tsrs-lint vp lint \
            --type-aware --type-check --deny-warnings

      # Package builds are already satisfied by the downloaded artifacts.
      - name: Generate documentation API
        run: vp run --filter @monque/docs --ignore-depends-on generate:api

      - name: Check documentation types
        run: vp run --filter @monque/docs --ignore-depends-on type-check

      - name: Build apps
        env:
          RUNTIME_CHECKS: ${{ needs.quality.outputs.runtime }}
        run: |
          if [[ "$RUNTIME_CHECKS" == "true" ]]; then
            vp run --filter './apps/*' --filter './examples/*' --ignore-depends-on build
          else
            vp run --filter @monque/docs --ignore-depends-on build
          fi

  test:
    name: Test (${{ matrix.group }})
    if: needs.quality.outputs.runtime == 'true'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        group: [backend, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus

      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: packages

      - name: Frontend tests
        if: matrix.group == 'frontend'
        run: vp run --filter @monque/dashboard --filter @monque/dashboard-dev --ignore-depends-on --concurrency-limit 1 test

      - name: Backend tests
        if: matrix.group == 'backend'
        run: bash scripts/ci/test-backend.sh

  consumers:
    name: MongoDB Driver Compatibility
    if: needs.quality.outputs.runtime == 'true'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare Changesets comparison ref
        run: git show-ref --verify --quiet refs/heads/main || git branch main origin/main
      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: packages
      - name: Verify packed packages with MongoDB drivers 6 and 7
        run: vp run verify:consumer

  dashboard-e2e:
    name: Dashboard MongoDB E2E (${{ matrix.project }})
    if: needs.quality.outputs.runtime == 'true'
    needs: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    container:
      # Match the Playwright version in bun.lock to use its bundled Chromium.
      image: mcr.microsoft.com/playwright:v1.65.1-resolute@sha256:dcf385f7a31aa1cbb0a7a0c97a539142bf70480b661f89f26a774ec1fe2edd1d
      options: --shm-size=1g
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.3.2-20260529T125201Z
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    strategy:
      fail-fast: true
      matrix:
        project:
          [
            mongo-desktop,
            mongo-mobile,
            mongo-desktop-auth,
            mongo-mobile-auth,
            host-express,
            host-effect,
          ]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
      - name: Download build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-artifacts
          path: packages
      - name: Test built Dashboard with MongoDB and selected host
        working-directory: apps/dashboard-dev
        env:
          MONQUE_DASHBOARD_TEST_MONGO_URI: mongodb://mongodb:27017/?directConnection=true
        run: vp exec playwright test --project=${{ matrix.project }}
      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-e2e-${{ matrix.project }}
          path: |
            apps/dashboard-dev/playwright-report
            apps/dashboard-dev/test-results
          retention-days: 7

  ci-gate:
    name: CI Gate
    needs: [quality, build-apps, test, consumers, dashboard-e2e]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bash scripts/ci/gate.sh
