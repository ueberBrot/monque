name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Lint & Type Check
        run: bun turbo lint type-check

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref || 'main' }}:${{ github.base_ref || 'main' }}

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Run Tests
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            bun turbo test --filter="...[${{ github.base_ref }}]"
          else
            bun turbo test
          fi

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    needs: [lint, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env

      - name: Build
        run: bun run build

      - name: Check Exports
        run: bun turbo check:exports

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts
          path: packages/*/dist
          retention-days: 1

  dashboard-e2e:
    name: Dashboard MongoDB E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project: [mongo-desktop, mongo-mobile, mongo-desktop-auth, mongo-mobile-auth]
    services:
      mongodb:
        image: mongodb/mongodb-atlas-local:8.2.6-20260529T125201Z
        ports:
          - 27018:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 30s
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env
      - name: Install Chromium
        working-directory: apps/dashboard-dev
        run: bunx playwright install --with-deps chromium
      - name: Test built dashboard with MongoDB and Express
        working-directory: apps/dashboard-dev
        run: bun run test:e2e --project=${{ matrix.project }}
      - name: Upload browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-e2e-${{ matrix.project }}
          path: |
            apps/dashboard-dev/playwright-report
            apps/dashboard-dev/test-results
          retention-days: 7

  check-changeset:
    name: Check Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check Changeset
        run: echo "Skipping changeset status check"

  ci-gate:
    name: CI Gate
    needs: [lint, test, build, dashboard-e2e, check-changeset]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          results=("${{ needs.lint.result }}" "${{ needs.test.result }}" "${{ needs.build.result }}" "${{ needs.dashboard-e2e.result }}" "${{ needs.check-changeset.result }}")
          for r in "${results[@]}"; do
            if [[ "$r" != "success" && "$r" != "skipped" ]]; then
              echo "Job failed with result: $r"
              exit 1
            fi
          done
