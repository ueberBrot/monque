name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      dashboard-version: ${{ steps.dashboard.outputs.version }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Vite+
        uses: ./.github/actions/setup-vite-plus
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          task-cache: "true"

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: vp run release:publish
          version-script: vp run release:version
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Select published Dashboard version
        id: dashboard
        if: steps.changesets.outputs.published == 'true'
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          version=$(jq -r '.[] | select(.name == "@monque/dashboard") | .version' <<< "$PUBLISHED_PACKAGES")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  dashboard-image:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.dashboard-version != ''
    uses: ./.github/workflows/dashboard-image.yml
    with:
      version: ${{ needs.release.outputs.dashboard-version }}
    permissions:
      contents: read
      packages: write

  deploy-docs:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
