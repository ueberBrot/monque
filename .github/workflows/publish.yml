name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write


jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      published: ${{ steps.changesets.outputs.published }}
    steps:
      - name: Generate App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun Environment
        uses: ./.github/actions/setup-bun-env
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Build
        run: bun run build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: bun run release
          version-script: bash -c "bun run changeset version && bun install --lockfile-only --ignore-scripts"
          commit-message: "chore: update versions"
          pr-title: "chore: update versions"
          github-token: ${{ steps.app-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  deploy-docs:
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.published == 'true'
    uses: ./.github/workflows/deploy-docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
