name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.decide.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Decide whether to deploy
        id: decide
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "${{ github.event_name }}" == "workflow_call" ]]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
          else
            if [ -d .changeset ]; then
              COUNT=$(find .changeset -name "*.md" ! -name "README.md" | wc -l | xargs)
              if [ "$COUNT" -eq "0" ]; then
                echo "should_deploy=true" >> $GITHUB_OUTPUT
              else
                echo "Pending changesets found. Documentation will be updated on release."
                echo "should_deploy=false" >> $GITHUB_OUTPUT
              fi
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Bun Environment
        id: setup
        if: steps.decide.outputs.should_deploy == 'true'
        uses: ./.github/actions/setup-bun-env

      - name: Build packages
        if: steps.decide.outputs.should_deploy == 'true'
        run: bun run build

      - name: Install, build, and upload docs
        if: steps.decide.outputs.should_deploy == 'true'
        uses: withastro/action@3eafd002e65cc31b4f0eae0bb05450d521562247 # v6.1.3
        with:
          path: ./apps/docs
          package-manager: bun@${{ steps.setup.outputs.bun-version }}

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Docs to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
