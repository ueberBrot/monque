name: Dashboard Container

on:
  push:
    branches: [main]
    paths: &dashboard-paths
      - "packages/dashboard/**"
      - "packages/management/**"
      - "packages/core/**"
      - "packages/*/package.json"
      - "apps/*/package.json"
      - "package.json"
      - "tsconfig.json"
      - "vite.config.ts"
      - "bun.lock"
      - ".node-version"
      - ".dockerignore"
      - ".github/workflows/dashboard-image.yml"
      - ".github/workflows/publish.yml"
  pull_request:
    paths: *dashboard-paths
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Published Dashboard npm version.
        required: true
        type: string

concurrency:
  group: dashboard-image-${{ inputs.version || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and verify dashboard image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check released Dashboard version
        if: inputs.version != ''
        env:
          DASHBOARD_VERSION: ${{ inputs.version }}
        run: jq --exit-status --arg version "$DASHBOARD_VERSION" '.version == $version' packages/dashboard/package.json > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/dashboard/Dockerfile
          load: true
          tags: monque-dashboard:verify
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=dashboard-image
          cache-to: type=gha,scope=dashboard-image,mode=max

      - name: Verify container runtime
        run: bash packages/dashboard/tests/docker/dashboard-image.sh monque-dashboard:verify

      - name: Save tested image
        if: inputs.version != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker image save monque-dashboard:verify --output /tmp/dashboard-image.tar

      - name: Upload tested image
        if: inputs.version != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-image
          path: /tmp/dashboard-image.tar
          overwrite: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    name: Publish dashboard image to GHCR
    needs: build
    if: inputs.version != '' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dashboard-image
          path: /tmp/dashboard-image

      - name: Load tested image
        run: docker image load --input /tmp/dashboard-image/dashboard-image.tar

      - name: Sign in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Publish version, commit, and latest tags
        env:
          DASHBOARD_VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dashboard"
          docker image tag monque-dashboard:verify "$image:$DASHBOARD_VERSION"
          docker image tag monque-dashboard:verify "$image:sha-$GITHUB_SHA"
          docker image push "$image:$DASHBOARD_VERSION"
          docker image push "$image:sha-$GITHUB_SHA"
          printf 'Published %s:%s and %s:sha-%s.\n' "$image" "$DASHBOARD_VERSION" "$image" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

          metadata=$(curl --fail --silent --show-error --retry 3 https://registry.npmjs.org/@monque%2Fdashboard/latest)
          latest=$(jq --exit-status --raw-output '.version' <<< "$metadata")
          if [[ "$latest" == "$DASHBOARD_VERSION" ]]; then
            docker image tag monque-dashboard:verify "$image:latest"
            docker image push "$image:latest"
            printf 'Updated %s:latest.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
          fi
