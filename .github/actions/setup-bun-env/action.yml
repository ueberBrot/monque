name: 'Setup Bun Environment'
description: 'Setup Bun, restore caches, and install dependencies'

inputs:
  bun-version:
    description: 'Optional Bun version override (defaults to package.json)'
    default: ''
  node-version:
    description: 'Node.js version to install'
    default: '22.23.2'
  registry-url:
    description: 'Optional npm registry URL for Node auth configuration'
    default: ''
  turbo-cache:
    description: 'Persist .turbo cache between CI runs'
    default: 'true'

outputs:
  bun-version:
    description: 'Installed Bun version'
    value: ${{ steps.bun.outputs.bun-version }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: ${{ inputs.registry-url }}

    - name: Setup Bun
      id: bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ inputs.bun-version }}
        bun-version-file: package.json

    - name: Cache Bun dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-bun-

    - name: Cache Turbo
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-

    - name: Install dependencies
      run: bun install --frozen-lockfile
      shell: bash
